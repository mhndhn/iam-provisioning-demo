name: CI
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true          # a new push cancels the old PR build

jobs:
  build-test:
    uses: mhndhn/shared-workflows/.github/workflows/dotnet-ci.yml@v1
    # runs-on: ubuntu-latest
    # steps:
    #   - uses: actions/checkout@v4

    #   - uses: actions/setup-dotnet@v4
    #     with:
    #       dotnet-version: '10.0.x'

    #   - name: Cache NuGet packages
    #     uses: actions/cache@v4
    #     with:
    #       path: ~/.nuget/packages
    #       key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
    #       restore-keys: nuget-${{ runner.os }}-

    #   - run: dotnet restore
    #   - run: dotnet build -c Release --no-restore
    #   - run: dotnet test -c Release --no-build --logger trx --results-directory TestResults --collect:"XPlat Code Coverage"

    #   - name: Upload test results
    #     if: always()                # upload even when tests fail
    #     uses: actions/upload-artifact@v4
    #     with:
    #       name: test-results
    #       path: TestResults
    #       retention-days: 7

  image:
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write             # needed to push to GHCR
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/provisioning-api
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=main,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Provisioning.Api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  